# seeker: tmux that keeps the host terminal's capabilities, with djosix's layout and keys.
# Personal overrides go in ~/.tmux.conf (loaded after this file, kept in the home volume).

# --- Terminal capabilities ---------------------------------------------------
set -g default-terminal "tmux-256color"
# Truecolor only when the host terminal advertises it (macOS Terminal.app doesn't).
if-shell 'case "$COLORTERM" in truecolor|24bit) exit 0;; esac; exit 1' \
  'set -as terminal-features ",*:RGB"; set-environment -g COLORTERM truecolor'
set -as terminal-features ",*:usstyle"     # undercurl / coloured underlines
set -as terminal-features ",*:clipboard"   # OSC 52: copies reach the host clipboard
set -as terminal-features ",*:hyperlinks"  # OSC 8 links
set -as terminal-features ",*:extkeys"
set -g extended-keys on                    # Shift+Enter, Ctrl+; ... reach apps that ask for them
set -g extended-keys-format csi-u
set -g allow-passthrough on                # inline images and other escape sequences
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 0                      # no delay after Esc (vim, readline)
set -ga update-environment " COLORTERM"

# --- Behaviour -----------------------------------------------------------------
set -g default-shell /bin/zsh
set -g history-limit 100000
set -g mouse on                            # wheel scrolls history; hold Option/Shift for native selection
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string "#{pane_title}"
set -g bell-action any
set -g visual-bell off
set -g display-time 2000

# --- Status line (djosix colours; the current window tab is purple) ------------
set -g status-style "fg=colour248,bg=colour236"
set -g status-left " #S "
set -g status-left-length 16
set -g status-left-style "fg=black,bg=white"
set -g status-right " #h %H:%M "
set -g status-right-style "fg=black,bg=white"
setw -g window-status-format " #I: #W "
setw -g window-status-current-format " #I: #W "
setw -g window-status-current-style "fg=colour231,bg=colour98,bold"

# --- Keys ----------------------------------------------------------------------
# Screen-style prefix (the default `C-b send-prefix` stays: prefix C-b sends a literal C-a).
set -g prefix C-a

bind r source-file /etc/tmux.conf \; source-file -q ~/.tmux.conf \; display "tmux config reloaded"

# Windows: lowercase keeps the current directory, the shifted key doesn't.
bind c new-window -c "#{pane_current_path}"
bind C new-window
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h
bind -n S-Right next-window
bind -n S-Left previous-window
bind -n S-Up swap-window -t -1 \; previous-window
bind -n S-Down swap-window -t +1 \; next-window

# Panes: Ctrl+Shift+arrows to move, h/j/k/l to resize (H/J/K/L in bigger steps).
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind h resize-pane -L 2
bind k resize-pane -U 2
bind j resize-pane -D 2
bind l resize-pane -R 2
bind H resize-pane -L 8
bind K resize-pane -U 8
bind J resize-pane -D 8
bind L resize-pane -R 8

# prefix a: copy mode
unbind a
bind a copy-mode
