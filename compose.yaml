name: seeker

services:
  seeker:
    build: .
    image: seeker:latest
    # Local-only image: always built from this Dockerfile (cached), never pulled from a registry.
    pull_policy: build
    hostname: seeker
    # Idle forever; all work happens in tmux sessions via `docker compose exec`.
    command: ["sleep", "infinity"]
    init: true
    # Nothing in here needs a graceful shutdown: stop/down kill it immediately.
    stop_signal: SIGKILL
    stop_grace_period: 0s
    working_dir: /workspace
    # Only these variables are taken from the host's .env (compose interpolation);
    # the file itself never enters the build context or the container.
    environment:
      TZ: ${TZ:-Asia/Taipei}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD:-artex}@postgres:5432/artex?sslmode=disable
      DSH_WEB_PORT: ${DSH_WEB_PORT:-3080}
      DSH_TELEMETRY_MODE: DISABLED
      REA_MCP_INPUT_SCHEMA_PROFILE: ${REA_MCP_INPUT_SCHEMA_PROFILE:-compact}
      REA_MCP_OUTPUT_SCHEMA_PROFILE: ${REA_MCP_OUTPUT_SCHEMA_PROFILE:-off}
    # gdb/strace/frida need ptrace and personality(); tshark/nmap need raw sockets.
    cap_add: [SYS_PTRACE, NET_ADMIN, NET_RAW]
    security_opt: [seccomp=unconfined]
    shm_size: 1gb
    ports:
      - "127.0.0.1:${DSH_WEB_PORT:-3080}:3080"     # DeepSeek Harness Web UI (dsh-web)
      - "127.0.0.1:${ARTEX_PORT:-8787}:8787"       # ARTEX Web UI (artex-start)
      - "127.0.0.1:${ARTEX_PROXY_PORT:-8788}:8788" # ARTEX intercept proxy
    volumes:
      - ./workspace:/workspace
      - home:/root
      - artex-data:/opt/artex/data
    depends_on:
      - postgres

  # ARTEX's database, same image and naming as ARTEX's own compose file.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artex}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  home:
  artex-data:
  pgdata:
